set_operation_mode:
  target:
    entity:
      integration: ha_daikin_altherma4_modbus
      domain: select
  fields:
    config_entry_id:
      example: "abc123def456"
      required: true
      selector:
        text:
    operation_mode:
      required: true
      selector:
        select:
          translation_key: service_operation_mode
          options:
          - "off"
          - heat
          - cool
