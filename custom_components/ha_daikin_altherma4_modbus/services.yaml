set_smart_grid_mode:
  name: Set Smart Grid mode
  description: Set the Smart Grid operation mode for energy management.
  target:
    entity:
      integration: ha_daikin_altherma4_modbus
      domain: select
  fields:
    config_entry_id:
      name: Config entry
      description: The config entry ID of the Daikin Altherma 4 heat pump.
      example: "abc123def456"
      required: true
      selector:
        text:
    smart_grid_mode:
      name: Smart Grid mode
      description: The Smart Grid mode to set.
      required: true
      selector:
        select:
          options:
            - "free running"
            - "forced off"
            - "recommended on"
            - "forced on"

start_dhw_single_heatup:
  name: Start DHW single heat-up
  description: Heat domestic hot water once to a target temperature. Returns immediately; a background task stops the request on target or timeout and fires ha_daikin_altherma4_modbus_dhw_single_heatup_finished.
  fields:
    config_entry_id:
      name: Config entry
      description: The config entry ID of the Daikin Altherma 4 heat pump.
      example: "abc123def456"
      required: true
      selector:
        text:
    target_temperature:
      name: Target temperature
      description: DHW target temperature in °C (30-85).
      required: true
      selector:
        number:
          min: 30
          max: 85
          step: 0.5
          unit_of_measurement: "°C"
    timeout:
      name: Timeout
      description: Maximum run time (1 minute to 6 hours, default 2 hours).
      required: false
      selector:
        duration:
    hysteresis:
      name: Hysteresis
      description: Finish below target by this amount in K (0-5, default 0.5).
      required: false
      selector:
        number:
          min: 0
          max: 5
          step: 0.1
          unit_of_measurement: "K"
