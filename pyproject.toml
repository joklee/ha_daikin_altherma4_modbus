[tool.coverage.run]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

[tool.ruff.lint]
# Ignore BLE001 (blind Exception catches) in cleanup/shutdown code where we want to ensure unload completes
# Ignore ASYNC230 in tests - test code uses open() for reading test fixture files
ignore = ["BLE001", "S102", "TRY002", "S110", "B017", "PLW0602", "ASYNC230"]

[tool.ruff.lint.per-file-ignores]
# Ignore E402 (module level import not at top of file) for const.py due to circular dependencies
"custom_components/ha_daikin_altherma4_modbus/const.py" = ["E402"]
# Ignore E402/I001 for test file with late import after stub setup
"tests/test_mock_client_16bit.py" = ["E402", "I001"]
# Ignore E402 for test file with late import after HA mock setup
"tests/test_services.py" = ["E402"]
